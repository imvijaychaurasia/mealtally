{% extends "web/base.html" %}{% load i18n %}
{% block content %}
<section class="mx-auto max-w-sm"><h1 class="text-2xl font-bold">{% trans "Create your account" %}</h1>
  <form method="post" class="card mt-4">{% csrf_token %}
    {% if error %}<p class="mb-3 rounded-lg bg-danger p-3 text-sm font-medium text-danger-ink" role="alert">{{ error }}</p>{% endif %}
    <label class="label" for="full_name">{% trans "Your name" %}</label><input class="input" id="full_name" name="full_name" required value="{{ form.full_name }}">
    <label class="label mt-4" for="phone">{% trans "Phone number" %}</label><input class="input" id="phone" name="phone" type="tel" inputmode="tel" required value="{{ form.phone }}">
    <label class="label mt-4" for="pin">{% blocktrans with n=cfg.customer_pin_length %}Choose a {{ n }}-digit PIN{% endblocktrans %}</label><input class="input" id="pin" name="pin" type="password" inputmode="numeric" required>
    <button class="btn-primary mt-5 w-full" type="submit">{% trans "Sign up" %}</button>
  </form></section>
{% endblock %}
