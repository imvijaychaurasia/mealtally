{% load i18n %}
{% for c in results %}<label class="mb-1 flex min-h-11 items-center gap-2 rounded-lg border border-strong p-2 has-[:checked]:border-primary has-[:checked]:bg-soft"><input type="radio" name="customer" value="{{ c.public_id }}"> <span>{{ c.full_name }} <span class="text-sm text-muted">({{ c.customer_code }} · {{ c.phone_e164|phone_masked }})</span></span></label>
{% empty %}{% if q %}<p class="text-sm text-ink-soft">{% trans "No match. Use “New customer” below." %}</p>{% endif %}{% endfor %}
