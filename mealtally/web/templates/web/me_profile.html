{% extends "web/base.html" %}{% load i18n %}
{% block content %}
<section class="mx-auto max-w-lg"><h1 class="text-2xl font-bold">{% trans "Profile" %}</h1>
  <form method="post" class="card mt-3">{% csrf_token %}
    {% if msg %}<p class="mb-3 rounded-lg bg-ok p-3 text-sm font-medium text-ok-ink" role="status">{{ msg }}</p>{% endif %}
    {% if err %}<p class="mb-3 rounded-lg bg-danger p-3 text-sm font-medium text-danger-ink" role="alert">{{ err }}</p>{% endif %}
    <label class="label" for="full_name">{% trans "Name" %}</label><input class="input" id="full_name" name="full_name" value="{{ customer.full_name }}" required>
    <label class="label mt-4" for="phone">{% trans "Phone" %}</label><input class="input bg-track" id="phone" value="{{ customer.phone_e164|phone_pretty }}" readonly aria-readonly="true">
    <button class="btn-primary mt-4" type="submit">{% trans "Save" %}</button>
  </form>
  <div class="mt-4 flex flex-wrap gap-2"><a class="btn-secondary" href="{% url 'web:me-pin' tenant.slug %}">{% trans "Change PIN" %}</a>
    <form method="post" action="{% url 'web:logout' %}">{% csrf_token %}<input type="hidden" name="slug" value="{{ tenant.slug }}"><button class="btn-secondary" type="submit">{% trans "Log out" %}</button></form></div>
</section>
{% endblock %}
