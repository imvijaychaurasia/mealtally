{% load i18n %}{% if errors %}<ul id="topup-errors" class="mb-2 grid gap-1 rounded-lg bg-danger p-3 text-sm font-semibold text-danger-ink" role="alert" data-testid="topup-errors">{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul>{% else %}<p class="mb-2 rounded-lg bg-ok p-3 text-sm font-semibold text-ok-ink" role="status" data-testid="topup-ok">{% trans "Request sent — waiting for approval (demo mode only)" %}</p>{% endif %}
