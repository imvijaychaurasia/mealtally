{% load i18n %}<h1 class="auth-title">{% trans "Change your password" %}</h1>
  {% if forced %}<p class="mt-3 rounded-xl bg-warn p-3 text-sm font-semibold text-warn-ink" role="status">{% trans "Please choose your own password before continuing." %}</p>{% endif %}
  <form method="post" class="mt-6" data-submit-once novalidate>{% csrf_token %}
    {% if err %}<p class="auth-alert" role="alert">{{ err }}</p>{% endif %}
    <label class="label" for="old_password">{% trans "Current password" %}</label><input class="input" id="old_password" name="old_password" type="password" autocomplete="current-password" required>
    <label class="label mt-4" for="new_password">{% trans "New password (at least 10 characters)" %}</label><input class="input" id="new_password" name="new_password" type="password" autocomplete="new-password" required>
    <label class="label mt-4" for="confirm_password">{% trans "Repeat new password" %}</label><input class="input" id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required>
    <button class="btn-primary mt-5 w-full" type="submit">{% trans "Save password" %}</button></form>
