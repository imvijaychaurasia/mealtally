{% load i18n %}<form method="post" action="{% url 'web:admin-driver-assign' tenant.slug %}" class="flex w-full items-center gap-2 sm:w-auto" data-testid="assign-{{ route.id }}">{% csrf_token %}<input type="hidden" name="route" value="{{ route.name }}"><label class="sr-only" for="drv-{{ route.id }}">{% trans "Driver" %}</label><select class="input min-w-0 flex-1 sm:w-auto sm:flex-none" id="drv-{{ route.id }}" name="driver">{% for m in drivers %}<option value="{{ m.pk }}" {% if m.route_name == route.name %}selected{% endif %}>{{ m.user.name|default:m.user.get_username }}</option>{% endfor %}</select><button class="btn-secondary" type="submit">{% trans "Assign" %}</button></form>
