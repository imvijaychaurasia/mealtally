version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: chore, include: scope }
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: chore, include: scope }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: chore, include: scope }
  - package-ecosystem: docker
    directory: /docker/postgres
    schedule: { interval: weekly }
    commit-message: { prefix: chore, include: scope }
