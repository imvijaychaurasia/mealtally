{% load i18n %}<div class="flex flex-col items-center gap-2 py-6 text-center" data-testid="empty-state">
  <span class="flex h-12 w-12 items-center justify-center rounded-full bg-accent-soft text-ink">{% include "web/_icon.html" with name=icon|default:"more" %}</span>
  <p class="font-semibold">{{ title }}</p>
  {% if text %}<p class="max-w-xs text-sm text-muted">{{ text }}</p>{% endif %}
  {% if action_url %}<a class="btn-primary mt-1" href="{{ action_url }}">{{ action_label }}</a>{% endif %}
</div>
