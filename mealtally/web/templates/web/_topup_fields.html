{% load i18n %}{# the browser checks first (pattern/min/max), the server checks again (web:me-topup-check). #}
<div><label class="label" for="amt">{% trans "Amount (₹)" %}</label><input class="input" id="amt" name="amount" form="topup-form" type="number" inputmode="numeric" required min="{{ topup_min }}" max="{{ topup_max }}" step="1" value="1000" aria-describedby="amt-hint topup-errors" data-testid="topup-amount"><p class="mt-1 text-xs text-muted" id="amt-hint">{% blocktrans with lo=topup_min hi=topup_max %}₹{{ lo }} to ₹{{ hi }}{% endblocktrans %}</p></div>
<div><label class="label" for="utr">UTR</label><input class="input" id="utr" name="utr" form="topup-form" inputmode="numeric" required pattern="[0-9]{12}" minlength="12" maxlength="12" autocomplete="off" placeholder="412800931204" title="{% trans 'The 12-digit UTR from your UPI app' %}" aria-describedby="topup-errors" data-testid="topup-utr"></div>
