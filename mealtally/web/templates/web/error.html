{% load static i18n %}<!doctype html>
{% get_current_language as html_lang %}{% get_current_language_bidi as html_bidi %}<html lang="{{ html_lang|default:'en' }}" dir="{% if html_bidi %}rtl{% else %}ltr{% endif %}" data-theme="{{ theme|default:'tally' }}" class="h-full bg-page">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ status }} · Mealtally</title>
  <link rel="stylesheet" href="{% static 'css/themes.css' %}">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="min-h-full font-sans text-ink antialiased">
  <header class="border-b border-subtle bg-card"><div class="mx-auto max-w-5xl px-4 py-3"><a class="text-lg font-bold text-primary" href="/">Mealtally</a></div></header>
  <main class="mx-auto max-w-md px-4 py-16 text-center">
    <p class="text-5xl font-extrabold text-subtle" aria-hidden="true">{{ status }}</p>
    <h1 class="mt-3 text-2xl font-bold">{{ title }}</h1>
    <p class="mt-3 text-ink-soft">{{ message }}</p>
    <div class="mt-6 flex justify-center gap-3"><a class="btn-primary" href="/">{% trans "Back to start" %}</a></div>
  </main>
</body>
</html>
