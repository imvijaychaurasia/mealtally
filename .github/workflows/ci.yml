# SPDX-License-Identifier: AGPL-3.0-only
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: ruff
        run: |
          uvx ruff@0.17.4 check .
          uvx ruff@0.17.4 format --check .
      - name: SPDX licence headers
        run: python3 scripts/spdx.py --check

  leak-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gitleaks, trufflehog and the denylist
        run: scripts/leak-scan.sh

  licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: Runtime dependencies are AGPL-compatible
        run: |
          uv sync --frozen --no-dev
          .venv/bin/python scripts/licenses.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Configure (throw-away secrets generated per run)
        run: |
          cp .env.example .env
          for key in DJANGO_SECRET_KEY POSTGRES_PASSWORD MEALTALLY_DB_OWNER_PASSWORD MEALTALLY_DB_APP_PASSWORD; do
            sed -i "s|^${key}=.*|${key}=$(openssl rand -hex 24)|" .env
          done
          sed -i "s|^MEALTALLY_ADMIN_EMAIL=.*|MEALTALLY_ADMIN_EMAIL=admin@example.com|" .env
      - name: Tests (coverage must stay at 95% or above)
        run: make test
      - name: Migrations are complete
        run: docker compose --profile test run --rm test python manage.py makemigrations --check --dry-run

  image:
    name: Docker image (amd64 and arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - name: Build the application image for both architectures
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build the database image for both architectures
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/postgres/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
