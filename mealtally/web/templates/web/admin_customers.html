{% extends "web/base.html" %}{% load i18n %}
{% block content %}
<div class="flex flex-wrap items-center justify-between gap-2"><h1 class="text-2xl font-bold">{% trans "Customers" %}</h1><a class="btn-primary" href="{% url 'web:staff-customer-new' tenant.slug %}">{% trans "New customer" %}</a></div>
<form class="card mt-3 grid gap-3 sm:grid-cols-2" hx-get="{% url 'web:admin-customers' tenant.slug %}" hx-trigger="input changed delay:250ms, change" hx-target="#rows">
  <div><label class="label" for="q">{% trans "Search" %}</label><input class="input" id="q" name="q" type="search" value="{{ q }}" autocomplete="off"></div>
  <div><label class="label" for="status">{% trans "Show" %}</label><select class="input" id="status" name="status">
    {% for v, l in filters %}<option value="{{ v }}">{{ l }}</option>{% endfor %}</select></div>
</form>
<div class="mt-3 overflow-x-auto rounded-2xl border border-subtle bg-card"><table class="min-w-full divide-y divide-subtle"><thead><tr><th class="th">{% trans "Code" %}</th><th class="th">{% trans "Name" %}</th><th class="th">{% trans "Phone" %}</th><th class="th">{% trans "Meals left" %}</th><th class="th">{% trans "Valid until" %}</th><th class="th">{% trans "Pass" %}</th></tr></thead>
<tbody id="rows" class="divide-y divide-subtle">{% include "web/_customer_rows.html" %}</tbody></table></div>
{% endblock %}
